<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Painel Criminalidade Baixada Santista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho, filtros em linha, KPIs, grade 2 colunas (linhas + mapa / rosca + naturezas). Visual roxo escuro herdado do relatório Power BI (tema Bloom). */
:root{
  --bg:#1d1640; --bg2:#2a2060; --card:#f8f6fc; --card-ink:#2b2142; --card-mute:#6b6285;
  --line:#e3dcf0; --accent:#8250c4; --accent-soft:#e6dbf3; --ink:#ffffff; --ink-mute:#c9bde6;
  --sea:#e9f1fb; --land:#f1edf7;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif; --font-body:'Barlow','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg2),var(--bg) 60%);background-color:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:8px 0 18px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4.4vw,44px);letter-spacing:.03em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink-mute);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.tab{font:600 14px var(--font-body);color:var(--ink);background:transparent;border:1px solid #ffffff55;border-radius:999px;padding:8px 18px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #ffd479;outline-offset:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;gap:4px;background:var(--card);color:var(--card-ink);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 16px #0004}
select{font:500 15px var(--font-body);border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;color:var(--card-ink);width:100%;text-transform:none;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#ffffff14;border:1px solid #ffffff26;border-radius:12px;padding:12px 16px;min-width:0}
.kpi small{display:block;color:var(--ink-mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{color:var(--ink-mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);color:var(--card-ink);border-radius:14px;padding:14px 16px 16px;box-shadow:0 8px 22px #0005;min-width:0}
.card h2{margin:0 0 8px;font-size:15px;font-weight:600;text-wrap:balance}
.card .hint{color:var(--card-mute);font-size:12px;margin:0 0 6px}
.box{position:relative;height:300px}
.box.tall{height:340px}
#map{height:300px;border-radius:8px;z-index:0}
svg text{font-family:var(--font-body)}
#tip{position:fixed;pointer-events:none;background:#1d1640;color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:5;white-space:nowrap}
.tblbtn{margin-top:18px;background:transparent;border:1px solid #ffffff55;color:var(--ink);border-radius:8px;padding:8px 14px;font:500 14px var(--font-body);cursor:pointer}
.tbl{overflow-x:auto;margin-top:12px;background:var(--card);color:var(--card-ink);border-radius:12px;padding:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1 id="titulo">Criminalidade na Baixada Santista</h1>

  <div class="tabs" role="group" aria-label="Medida">

  <div class="filters">

    <section class="card"><h2 id="h-nat"></h2><div class="box tall"><canvas id="c-nat" role="img" aria-label="Valor por natureza"></canvas></div></section>
  </div>

  <button class="tblbtn" id="tblbtn" aria-expanded="false">Ver tabela de dados</button>
  <div class="tbl" id="tbl" hidden></div>
</div>

  $('kpis').innerHTML=
    `<div class="kpi"><small>Total no filtro</small><b>${fmt(total)}</b><span>${unit()}</span></div>`+
    `<div class="kpi"><small>Cidade com maior valor</small><b>${tc?D.city[tc[0]]:'-'}</b><span>${tc?fmt(tc[1]):''}</span></div>`+
    `<div class="kpi"><small>Natureza com maior valor</small><b>${tn?D.nat[tn[0]]:'-'}</b><span>${tn?fmt(tn[1]):''}</span></div>`;
  $('h-line').textContent=`Soma de ${S.m==='q'?'quantidade':'taxa por 100 mil'} por ano e cidade`;
  $('h-pie').textContent=`Soma de ${S.m==='q'?'quantidade':'taxa por 100 mil'} por ano`;
  $('h-nat').textContent=`Soma de ${S.m==='q'?'quantidade':'taxa por 100 mil'} por natureza`;

  // linhas
  const cityYear=new Map(); rs.forEach(r=>{const k=r[1]+'|'+r[2];cityYear.set(k,(cityYear.get(k)||0)+val(r));});
  const hidden=new Set(lineC.data.datasets.filter((d,i)=>lineC.getDatasetMeta(i).hidden).map(d=>d.label));
  lineC.data.datasets=D.city.map((c,i)=>({label:c,borderColor:cityColor[c],backgroundColor:cityColor[c],borderWidth:2,pointRadius:YEARS.length&&S.ano?5:3,tension:.25,
    data:YEARS.map(y=>S.ano&&y!=S.ano?null:(S.city===''||S.city==i)?(cityYear.get(i+'|'+y)??0):null),hidden:hidden.has(c)}));
  lineC.update();

  // rosca por ano
  const ys=YEARS.filter(y=>byYear.has(y));
  pieC.data.labels=ys.map(String); pieC.data.datasets[0].data=ys.map(y=>byYear.get(y));
  pieC.data.datasets[0].backgroundColor=ys.map(y=>['#8250c4','#5ecbc8','#438fff','#ff977e','#eb5757','#ec5a96','#a43b76','#5b2071'][YEARS.indexOf(y)]);
  pieC.update();

  // natureza
  const ns=[...byNat.entries()].sort((a,b)=>b[1]-a[1]);
  natC.data.labels=ns.map(n=>D.nat[n[0]]); natC.data.datasets[0].data=ns.map(n=>n[1]); natC.update();

  renderMap(byCity);

  // tabela
  const tr=D.city.map((c,i)=>`<tr><td>${c}</td>${YEARS.map(y=>`<td>${fmt(cityYear.get(i+'|'+y)||0)}</td>`).join('')}<td><b>${fmt(byCity.get(i)||0)}</b></td></tr>`).join('');
  $('tbl').innerHTML=`<table><thead><tr><th>Cidade</th>${YEARS.map(y=>`<th>${y}</th>`).join('')}<th>Total</th></tr></thead><tbody>${tr}</tbody></table>`;
}
$('tq').onclick=()=>{S.m='q';render();}; $('tt').onclick=()=>{S.m='t';render();};
$('tblbtn').onclick=()=>{const t=$('tbl');t.hidden=!t.hidden;$('tblbtn').setAttribute('aria-expanded',!t.hidden);$('tblbtn').textContent=t.hidden?'Ver tabela de dados':'Ocultar tabela de dados';};
render();
</script>

</body></html>
